<!doctype html>
<meta charset="utf-8"><title>proxmox-card test</title>
<style>
  :root { --primary-text-color:#212121; --secondary-text-color:#727272; --card-background-color:#fff; --secondary-background-color:#f3f3f3; --success-color:#43a047; --warning-color:#ffa600; --error-color:#db4437; --disabled-text-color:#9e9e9e; }
  body.dark { --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --card-background-color:#1c1c1c; --secondary-background-color:#2a2a2a; background:#111; }
  body { font-family:Roboto,sans-serif; margin:16px; background:#e9e9e9; }
  body.dark { background:#111; }
  ha-card { background:var(--card-background-color); border-radius:12px; display:block; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  ha-icon { display:inline-block; width:24px; height:24px; text-align:center; font-size:10px; }
  .wrap { max-width:760px; } .narrow { max-width:320px; margin-top:16px; }
</style>
<body>
<button onclick="document.body.classList.toggle('dark')">dark</button>
<div class="wrap" id="a"></div><div class="narrow" id="b"></div>
<script type="module">
  import { ProxmoxCard } from "../src/proxmox-card.js";
  const states = {}, entities = {}, devices = {};
  const dev = (id, name, model) => (devices[id] = { id, name, model });
  const ent = (device_id, domain, key, state, extra = {}) => {
    const entity_id = `${domain}.${device_id}_${key}`;
    entities[entity_id] = { entity_id, platform: "proxmoxve", device_id, translation_key: key };
    states[entity_id] = { entity_id, state: String(state), attributes: extra };
  };
  dev("n1", "Node pve", "Node"); ent("n1", "sensor", "status", "online"); ent("n1", "sensor", "cpu_used", 23); ent("n1", "sensor", "memory_used_percentage", 61); ent("n1", "sensor", "disk_used_percentage", 84); ent("n1", "sensor", "uptime", 1900000);
  dev("n2", "Node pve2", "Node"); ent("n2", "sensor", "status", "offline");
  const guests = [["q1", "QEMU homeassistant (100)", "QEMU", "running", 12, 78, "192.168.1.20"], ["q2", "QEMU docmost (109)", "QEMU", "stopped", 0, 0, ""], ["q3", "QEMU nas (101)", "QEMU", "running", 95, 91, "192.168.1.30"],
    ["l1", "LXC CT516 (516)", "LXC", "running", 4, 33, "192.168.1.51"]];
  for (const [id, name, model, st, cpu, mem, ip] of guests) {
    dev(id, name, model); ent(id, "sensor", "status", st); ent(id, "sensor", "cpu_used", cpu); ent(id, "sensor", "memory_used_percentage", mem);
    ent(id, "sensor", "ip_address", ip || "unknown");
    ent(id, "button", st === "running" ? "shutdown" : "start", "unknown"); if (st === "running") ent(id, "button", "reboot", "unknown");
  }
  const hass = { states, entities, devices, language: "fr", locale: { language: "fr" },
    callService: (d, s, p) => console.log("service", d, s, p) };
  window.__hass = hass;
  document.addEventListener("hass-more-info", (e) => console.log("more-info", e.detail));
  for (const [sel, cfg] of [["a", { title: "Proxmox" }], ["b", { title: "Proxmox" }]]) {
    const c = new ProxmoxCard(); c.setConfig(cfg); c.hass = hass; document.getElementById(sel).append(c);
  }
</script>
