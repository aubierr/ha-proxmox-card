name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: plugin

  javascript:
    name: JavaScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Syntax check (ES module)
        run: |
          cp dist/proxmox-card.js "$RUNNER_TEMP/proxmox-card.mjs"
          node --check "$RUNNER_TEMP/proxmox-card.mjs"
      - name: Check that every language is complete
        run: node test/check-i18n.mjs
