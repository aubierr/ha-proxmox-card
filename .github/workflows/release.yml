name: Release

# Pushing a tag vX.Y.Z publishes the GitHub release (the one HACS offers), with the notes of that version in CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Checks
        run: |
          cp dist/proxmox-card.js "$RUNNER_TEMP/proxmox-card.mjs"
          node --check "$RUNNER_TEMP/proxmox-card.mjs"
          node test/check-version.mjs
          node test/check-i18n.mjs
          node test/check-format.mjs
          node test/check-roles.mjs
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" 'index($0, v) == 1 && (length($0) == length(v) || substr($0, length(v) + 1, 1) == " ") { f = 1; next } /^## / { if (f) exit } f' CHANGELOG.md | sed '/./,$!d' > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "no notes for $version in CHANGELOG.md"; exit 1; }
          cat "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
